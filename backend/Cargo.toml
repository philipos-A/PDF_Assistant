[package]
name = "pdf-assistant-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Backend for PDF Assistant: PDF upload and streaming Claude chat"
license = "MIT"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures-util = "0.3.34"
lopdf = "0.47.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "multipart"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
uuid = { version = "1.29.3", features = ["v4"] }
